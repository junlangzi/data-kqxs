name: Update data
on:
  schedule:
    - cron: '35 11 * * *' # 6:35 PM in Vietnam
  workflow_dispatch: # Thêm dòng này nếu muốn chạy thủ công
jobs:
  update-data:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repo content
        uses: actions/checkout@v5          # ← đổi từ @v4 → @v5

      - name: setup python
        uses: actions/setup-python@v6      # ← đổi từ @v5 → @v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install python packages
        run: |
          pip install -r requirements.txt

      - name: update data
        run: python main.py

      - name: get current date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: push changes
        uses: actions-x/commit@v6          # Giữ nguyên (action này dùng shell, không dùng Node)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: Updated ${{ env.date }}
          email: action@github.com
          name: GitHub Action
